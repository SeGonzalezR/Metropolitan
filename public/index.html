<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#131010" />
  <title>Metropolitan Karaoke</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" />
  <script>
    // Tema antes de pintar (oscuro por defecto) para evitar el parpadeo.
    (function () {
      var t = 'dark';
      try { t = localStorage.getItem('karaoke.theme') === 'light' ? 'light' : 'dark'; } catch (e) {}
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="queue">
  <header class="top">
    <div class="brand">
      <img src="icon.svg" alt="" width="28" height="28" />
      <div>
        <strong>Metropolitan</strong>
        <span>Karaoke</span>
      </div>
    </div>
    <div class="top-actions">
      <div class="live" id="live"><i></i><span>En vivo</span></div>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Cambiar a modo claro">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main>
    <!-- Estado personal: lo más importante para quien espera -->
    <section id="mine" class="mine" hidden></section>

    <!-- Reseña: aparece una vez, justo después de cantar -->
    <section id="review-prompt" class="card review" hidden></section>

    <!-- Ahora cantando -->
    <section class="now card" id="now"></section>

    <!-- Vistas -->
    <section class="view" id="view-queue">
      <div class="view-head">
        <h2>Próximos</h2>
        <span class="muted" id="queue-meta"></span>
      </div>
      <ol class="list" id="queue"></ol>
    </section>

    <section class="view" id="view-join" hidden>
      <div class="view-head"><h2>Inscríbete</h2></div>
      <div class="card hint" id="join-hint"></div>
      <form id="join" class="card form" autocomplete="on">
        <div class="field">
          <label for="song-input">Canción</label>
          <div class="ac">
            <input id="song-input" name="song" maxlength="80" required autocomplete="off"
              placeholder="Busca por canción o artista" role="combobox" aria-autocomplete="list"
              aria-expanded="false" aria-controls="suggest" />
            <ul id="suggest" class="suggest" role="listbox" hidden></ul>
          </div>
          <input type="hidden" name="catalogId" />
          <p class="field-note" id="song-note"></p>
        </div>
        <label>Artista <small>(opcional)</small>
          <input name="artist" maxlength="60" placeholder="Ej: Soda Stereo" />
        </label>
        <label>Tu nombre o apodo
          <input name="name" maxlength="30" required placeholder="Ej: Cata" autocomplete="nickname" />
        </label>
        <label>Mesa <small>(opcional)</small>
          <input name="table" maxlength="10" inputmode="numeric" placeholder="Ej: 7" />
        </label>
        <p class="error" id="join-error" role="alert"></p>
        <button type="submit" class="btn primary">Anotarme en la lista</button>
      </form>
    </section>

    <section class="view" id="view-songs" hidden>
      <div class="view-head">
        <h2>Canciones de la noche</h2>
        <span class="muted" id="songs-meta"></span>
      </div>
      <input type="search" id="song-search" class="search" placeholder="Buscar canción, artista o persona" />
      <ul class="list songs" id="songs"></ul>
      <div id="catalog-results" hidden>
        <div class="view-head"><h2>Disponibles en el bar</h2><span class="muted" id="catalog-meta"></span></div>
        <ul class="list" id="catalog-list"></ul>
      </div>
    </section>

    <section class="view" id="view-menu" hidden>
      <div class="view-head"><h2>Carta</h2></div>
      <div class="card menu-card" id="menu"></div>
      <section class="card review" id="review-static" hidden></section>
    </section>
  </main>

  <nav class="tabs" aria-label="Secciones">
    <button data-view="queue" class="active">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Lista
    </button>
    <button data-view="join" class="join-tab">
      <span class="ico-pill"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>Anotarme
    </button>
    <button data-view="songs">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>Canciones
    </button>
    <button data-view="menu">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16l-8 9z"/><path d="M12 13v7M8 20h8"/></svg>Carta
    </button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="common.js"></script>
  <script src="app.js"></script>
</body>
</html>
